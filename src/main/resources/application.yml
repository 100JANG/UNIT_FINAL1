spring:
  application:
    name: unit-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

unit:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY_DO_NOT_USE_IN_PROD_32B}
    issuer: ${JWT_ISSUER:unit-api}
    session-ttl-seconds: ${JWT_SESSION_TTL_SECONDS:2592000}
  semester:
    current: ${UNIT_CURRENT_SEMESTER:2026-1}
    expires-at: ${UNIT_SEMESTER_EXPIRES_AT:2026-08-31T23:59:59Z}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    database-url: ${FIREBASE_DATABASE_URL:}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    enabled: ${FIREBASE_ENABLED:false}

logging:
  level:
    root: INFO
    kr.unit.backend: DEBUG
